services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy

  # Video worker (phase-03-videos/TD-06, TD-16): second entrypoint of the same
  # code (mounted), FFmpeg pinned in its image, non-root, no published ports.
  # It reads the same .env as the API. Run `npm run build` in nestjs-api first:
  # the worker executes the compiled dist/worker/main.worker.js.
  worker:
    build:
      context: ./docker/worker
    volumes:
      - .:/srv/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # SIGTERM → enableShutdownHooks → boss.stop({ graceful: true }).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          memory: "${WORKER_MEMORY_LIMIT:-2g}"

  # Pinned, SHA-256-verified MinIO (phase-03-videos/TD-03, TD-16).
  # Credentials come only from the local .env.
  minio:
    build:
      context: ./docker/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3001}
    volumes:
      - minio-data:/data

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  minio-data:


